<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment Successful — Prime Print</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f5;
        --card: #ffffff;
        --text: #1a2e1f;
        --muted: #5f6f63;
        --accent: #1f7a4d;
        --accent-soft: #e8f5ee;
        --border: #d8e3dc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #e9f0eb 100%);
        color: var(--text);
      }

      .card {
        width: min(100%, 440px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 12px 40px rgba(26, 46, 31, 0.08);
        text-align: center;
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 36px;
        line-height: 1;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
        font-weight: 700;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .ref {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--bg);
        font-size: 0.9rem;
        word-break: break-all;
      }

      .ref strong {
        color: var(--text);
      }

      .actions {
        margin-top: 24px;
      }

      a.button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }

      a.button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">✓</div>
      <h1>Payment successful</h1>
      <p>
        Thank you for your payment. Your invoice will be updated shortly and you
        will receive a confirmation on WhatsApp.
      </p>
      <div class="ref" id="reference" hidden>
        Reference: <strong id="reference-id"></strong>
      </div>
      <div class="actions">
        <a class="button" href="https://www.primeprint.com.kw">Back to Prime Print</a>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const tapId = params.get("tap_id");
      if (tapId) {
        document.getElementById("reference-id").textContent = tapId;
        document.getElementById("reference").hidden = false;
      }
    </script>
  </body>
</html>
